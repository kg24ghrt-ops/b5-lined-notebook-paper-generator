name: Compile Check

on:
  workflow_dispatch:
    inputs:
      lint:
        description: 'Also run :app:lintDebug'
        type: boolean
        required: false
        default: false
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Compile Java
        working-directory: android
        run: ./gradlew :library:compileDebugJavaWithJavac :app:compileDebugJavaWithJavac --console=plain --stacktrace

      - name: Lint Debug
        if: ${{ inputs.lint }}
        working-directory: android
        run: ./gradlew :app:lintDebug --console=plain --stacktrace

      - name: Upload Gradle output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output-${{ github.run_id }}
          path: |
            android/build
            android/library/build
            android/app/build
