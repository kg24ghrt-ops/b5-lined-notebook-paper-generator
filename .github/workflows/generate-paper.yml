name: Generate Notebook Paper

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate notebook paper
        run: |
          mkdir -p output
          mvn compile exec:java

      - name: Upload generated PNG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-paper-b5-lined
          path: output/notebook-paper-b5-lined.png
          if-no-files-found: error

      - name: Create release with PNG
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paper-v${{ github.run_number }}
          name: Notebook Paper B5 Lined (Build ${{ github.run_number }})
          files: output/notebook-paper-b5-lined.png
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
