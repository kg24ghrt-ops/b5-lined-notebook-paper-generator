name: Generate Notebook Paper

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build jar and generate notebook paper
        run: |
          mkdir -p output
          mvn package exec:java

      - name: Upload PNG and jar as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-paper-build-${{ github.run_number }}
          path: |
            output/notebook-paper-b5-lined.png
            target/notebook-paper-generator-1.0.0.jar
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android app
        run: cd android && ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notebook-paper-app-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error